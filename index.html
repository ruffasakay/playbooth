<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie library + photobooth: a Video.js v10 player</title>
<!-- Video.js v10.3.0 from jsDelivr, pinned. -->
<script type="module">
  const B = 'https://cdn.jsdelivr.net/npm/@videojs/cdn@10.3.0/';
  const ui = ['container','play-button','time-slider','slider-track','slider-buffer','slider-fill','slider-thumb','time','mute-button','fullscreen-button','hotkey','status-announcer'];
  await import(B + 'video-player.js');
  await Promise.all(ui.map(n => import(B + 'ui/' + n + '.js')));
</script>
<style>
:root{--ink:#26211f;--sc:#bcd6f7;--bg:#f2f4f8;--ln:#c9cdd6;--hl:#2f6bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:500 14px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;width:1500px;height:940px;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
#world.free{transition:none}
.floor{position:absolute;left:0;right:0;top:660px;height:2px;background:var(--ln);transition:opacity .5s}
.hint{position:fixed;left:0;right:0;top:12px;text-align:center;pointer-events:none;z-index:5}
.hint span{display:inline-block;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--ln)}

/* Library: side-view shelf */
.shelf{position:absolute;left:60px;top:100px;width:580px;height:560px;display:flex;flex-direction:column;border:4px solid #b9bfca;background:#e8ebf0;cursor:zoom-in;transition:opacity .5s}
.row{flex:1;display:flex;align-items:flex-end;gap:6px;padding:0 14px;border-bottom:4px solid #b9bfca}
.row:last-child{border-bottom:0}
.sp{flex:none;width:18px;height:82%;padding:0;border:0;border-radius:2px;background:var(--c);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.sp.fl{height:var(--h);pointer-events:none}
.sp.mv span{display:block;opacity:0;writing-mode:vertical-rl;font-weight:600;font-size:15px;transition:opacity .3s;white-space:nowrap}
.near .sp.mv{width:78px;cursor:grab}
.near .sp.mv span{opacity:1}
.near .shelf{cursor:default}
.sp.mv:hover{filter:brightness(.94)}
.ghost{position:fixed;left:0;top:0;z-index:20;width:120px;height:150px;padding:12px;border-radius:6px;border:2px solid var(--ink);font-weight:700;pointer-events:none;box-shadow:0 8px 20px rgb(0 0 0/.2)}

/* Photobooth: side-view front elevation, plain flat shapes */
.booth{position:absolute;left:760px;top:40px;width:640px;height:620px}
.bbody{position:absolute;inset:0;background:#e4e6ea;border:4px solid #b9bfca;border-radius:12px 12px 0 0;transition:opacity .5s}
.bezel{position:absolute;left:56px;top:40px;width:528px;height:324px;background:var(--ink);border-radius:10px}
.slot{position:absolute;left:210px;top:420px;width:220px;height:16px;background:var(--ink);border-radius:8px}
.led{position:absolute;left:452px;top:424px;width:8px;height:8px;border-radius:50%;background:#aab}
.reading .led{background:var(--hl);animation:bl .35s infinite alternate}
@keyframes bl{to{opacity:.2}}
.lab{position:absolute;font-size:12px;color:#6b7080;transform:translateX(-50%)}
.pslot{position:absolute;left:130px;top:584px;width:380px;height:14px;background:var(--ink);border-radius:7px}
.tray{position:absolute;left:150px;top:598px;width:340px;height:290px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;gap:8px;transition:opacity .5s}
.strip{flex:none;padding:0;border:1px solid var(--ln);background:#fff;box-shadow:0 2px 8px rgb(0 0 0/.15);animation:out 1.1s cubic-bezier(.3,.7,.2,1) backwards}
.strip img{display:block;width:76px}
@keyframes out{from{translate:0 -105%}}
.screen{position:absolute;left:80px;top:64px;width:480px;height:300px;display:block;overflow:hidden;background:var(--sc)}
.screen video{background:#000}
#fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[data-s=browse] #v,[data-s=browse] #fr,[data-s=reading] #v,[data-s=reading] #fr{visibility:hidden}
.msg{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;z-index:2;font-weight:600}
.pg{width:160px;height:6px;margin:auto;border-radius:3px;background:rgb(38 33 31/.2);overflow:hidden}
.pg i{display:block;height:100%;background:var(--ink);animation:fill 1.6s linear forwards}
@keyframes fill{from{width:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:fl .25s}
@keyframes fl{from{opacity:.9}}
.focus .bbody,.focus .shelf,.focus .floor,.focus .tray{opacity:0;pointer-events:none}

/* Movable controls (Video.js elements inside a draggable bar) */
.bar{position:absolute;z-index:3;display:none;align-items:center;gap:2px;width:464px;padding:3px 6px 3px 2px;background:#fff;border:1px solid var(--ln);border-radius:10px;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
[data-s=play] .bar{display:flex}
.grip{display:grid;place-items:center;flex:none;width:18px;height:32px;padding:0;border:0;background:none;cursor:move;touch-action:none;color:#8a90a0}
.btn{display:grid;place-items:center;flex:none;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:none}
.btn:hover{background:#eceef3}
.btn svg,.grip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:currentColor!important}
.ts{position:relative;flex:1;height:32px;min-width:60px;display:block;cursor:pointer}
.trk{position:absolute;left:0;right:0;top:50%;height:4px;translate:0 -50%;border-radius:2px;background:#d9dce4}
.trk media-slider-buffer{position:absolute;inset:0 auto 0 0;width:var(--media-slider-buffer);background:#c2c7d3;border-radius:inherit}
.trk media-slider-fill{position:absolute;inset:0 auto 0 0;width:var(--media-slider-fill);background:var(--ink);border-radius:inherit}
.thb{position:absolute;top:50%;left:var(--media-slider-fill);width:12px;height:12px;translate:-50% -50%;border-radius:50%;background:var(--ink)}
.tm{display:flex;gap:3px;flex:none}
.vol{width:48px;flex:none;accent-color:var(--ink)}

media-play-button .ip,media-play-button .ir,media-mute-button .ix,media-fullscreen-button .ie{display:none}
media-play-button[data-paused]:not([data-ended]) .ip{display:block}
media-play-button:not([data-paused]):not([data-ended]) .ia{display:block}
media-play-button:not([data-paused]):not([data-ended]) .ip{display:none}
media-play-button:not([data-paused]):not([data-ended]) .ipa{display:block}
media-play-button .ipa{display:none}
media-play-button[data-ended] .ir{display:block}
media-play-button[data-ended] .ip,media-play-button[data-ended] .ipa{display:none}
media-mute-button[data-muted] .ix{display:block}
media-mute-button[data-muted] .iu{display:none}
media-fullscreen-button[data-fullscreen] .ie{display:block}
media-fullscreen-button[data-fullscreen] .ien{display:none}



/* Plain panels */
.tb{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:5}
.tb button,.picker button.ok,#lb a,#lb button{padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;text-decoration:none}
.tb form{display:flex;gap:6px;width:100%}.tb input{flex:1;min-width:0;width:min(300px,70vw);padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;font:inherit;color:inherit}
.tb button:hover,.picker button:hover{background:#eceef3}
.picker{position:fixed;right:12px;top:50%;translate:0 -50%;width:206px;padding:12px;border:1px solid var(--ln);border-radius:12px;background:#fff;z-index:6;display:none}
[data-s=border] .picker{display:block}
.picker h2{margin:0 0 8px;font-size:14px}
.bos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bo{display:grid;gap:4px;padding:4px;border:2px solid transparent;border-radius:8px;background:none;font-size:12px}
.bo canvas{width:100%;display:block;border:1px solid var(--ln)}
.bo[aria-pressed=true]{border-color:var(--ink)}
.picker .ok{width:100%;background:var(--ink);color:#fff;border-color:var(--ink)}
.gal{position:fixed;right:12px;top:52px;width:236px;max-height:70vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:#fff;z-index:6}
.gal img{width:100%;display:block;border:1px solid var(--ln)}
#lb{position:fixed;inset:0;z-index:30;display:grid;place-content:center;gap:10px;justify-items:center;background:rgb(242 244 248/.94)}
#lb img{max-height:78vh;max-width:90vw;border:1px solid var(--ln);box-shadow:0 4px 18px rgb(0 0 0/.15)}
#lb div{display:flex;gap:8px}
@media (max-width:720px){.picker{inset:auto 8px 8px 8px;width:auto;translate:none}.bos{grid-template-columns:repeat(5,1fr)}.bo span{display:none}.tb{bottom:auto;top:56px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
@media (forced-colors:active){.picker,.bar,.gal,.hint span{border:1px solid CanvasText}}
</style>
</head>
<body data-s="browse">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="M9.7 6.2v11.6l9-5.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect class="fill" x="6.5" y="5.5" width="3.6" height="13" rx="1.2"/><rect class="fill" x="13.9" y="5.5" width="3.6" height="13" rx="1.2"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4.5v4h4"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-3.5v12l-4.5-3.5h-3z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-3.5v12l-4.5-3.5h-3z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4"/></symbol>

  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3v-3H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></symbol>
</defs></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-rw" viewBox="0 0 24 24"><path class="fill" d="M11.5 6.5v11L4 12zM19.5 6.5v11L12 12z"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24"><path class="fill" d="M12.5 6.5v11L20 12zM4.5 6.5v11L12 12z"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="i-gr" viewBox="0 0 24 24"><g class="fill"><circle cx="9" cy="7" r="1.4"/><circle cx="15" cy="7" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="17" r="1.4"/><circle cx="15" cy="17" r="1.4"/></g></symbol>
</defs></svg>

<div class="hint" aria-live="polite"><span id="hint"></span></div>

<div id="stage">
 <div id="world">
  <div class="floor"></div>
  <div class="shelf" id="shelf" role="group" aria-label="Movie library"><div class="row" id="r0"></div><div class="row" id="r1"></div><div class="row" id="r2"></div></div>
  <div class="booth" id="booth">
    <div class="bbody">
      <div class="bezel"></div>
      <div class="slot" id="slot"></div><i class="led"></i><span class="lab" style="left:320px;top:444px">Insert movie</span>
      <div class="pslot"></div><span class="lab" style="left:320px;top:566px">Pictures print here</span>
    </div>
    <video-player style="display:contents">
      <media-container class="screen" id="screen">
        <video id="v" playsinline preload="auto" poster="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/thumbnail.jpg?time=2"></video>
        <canvas id="fr" width="640" height="400"></canvas>
        <div class="msg" id="msg">No movie</div>
        <div class="flash" id="flash"></div>
        <div class="bar" id="bar" role="group" aria-label="Player controls (drag the handle to move)">
          <button class="grip" id="grip" type="button" aria-label="Move controls"><svg><use href="#i-gr"/></svg></button>
          <button class="btn" id="rw" type="button" aria-label="Rewind 10 seconds"><svg><use href="#i-rw"/></svg></button>
          <media-play-button class="btn"><svg class="ip"><use href="#i-play"/></svg><svg class="ipa"><use href="#i-pause"/></svg><svg class="ir"><use href="#i-redo"/></svg></media-play-button>
          <button class="btn" id="ff" type="button" aria-label="Fast-forward 10 seconds"><svg><use href="#i-ff"/></svg></button>
          <media-time-slider class="ts"><media-slider-track class="trk"><media-slider-buffer></media-slider-buffer><media-slider-fill></media-slider-fill></media-slider-track><media-slider-thumb class="thb"></media-slider-thumb></media-time-slider>
          <div class="tm"><media-time type="current"></media-time><span aria-hidden="true">/</span><media-time type="duration"></media-time></div>
          <media-mute-button class="btn"><svg class="iu"><use href="#i-vol"/></svg><svg class="ix"><use href="#i-mute"/></svg></media-mute-button>
          <input class="vol" id="vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume">
          <button class="btn" id="snap" type="button" aria-label="Take screenshot"><svg><use href="#i-cam"/></svg></button>

        </div>
        <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
        <media-hotkey keys="k" action="togglePaused"></media-hotkey>
        <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
        <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
        <media-hotkey keys="ArrowLeft" action="seekStep" value="-5"></media-hotkey>
        <media-hotkey keys="ArrowRight" action="seekStep" value="5"></media-hotkey>
        <media-status-announcer></media-status-announcer>
      </media-container>
    </video-player>
    <div class="tray" id="tray"></div>
  </div>
 </div>
</div>

<div class="tb">
  <form id="uf" data-on="browse"><input id="u" type="url" placeholder="Paste a public video URL to test" aria-label="Video URL"><button type="submit">Load</button></form>
  <button type="button" id="zo" aria-label="Zoom out">−</button>
  <button type="button" id="zi" aria-label="Zoom in">+</button>
  <button type="button" id="zf">Fit</button>
  <button type="button" id="fc" data-on="border play">Focus movie</button>
  <button type="button" id="sh" data-on="play print">Shots (<span id="n">0</span>)</button>
  <button type="button" id="pr" data-on="play">Print</button>
</div>
<div class="picker" role="group" aria-label="Border">
  <h2>Border</h2><div class="bos" id="bos"></div><button type="button" class="ok" id="ok">Use this border</button>
</div>
<div class="gal" id="gal" hidden></div>
<div id="lb" hidden><img id="lbi" alt="Printed strip"><div><a id="dl" href="#">Save</a><button type="button" id="lc">Close</button></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id), st = $('stage'), wd = $('world'), v = $('v'), sr = $('screen'), bt = $('booth'), sh = $('shelf');
  const SRC = 'https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4'; // replace with your own movies
  const MV = [['Reel 01','#c9d3e6',0],['Reel 02','#dccbcb',.15],['Reel 03','#cadccb',.3],['Reel 04','#e2dabf',.45],['Reel 05','#d3cbe2',.6],['Reel 06','#c5dadd',.75]].map(([t, c, p]) => ({ t, c, p }));
  const H = { browse:'Zoom into the shelf (scroll or +), then drag a movie into the slot.', reading:'Reading the movie…', border:'Choose a border, then confirm.', play:'Press play. Tap the camera to keep a frame.', print:'Your pictures are printing. Tap a strip to view or save it.' };
  const q = new URLSearchParams(location.search);
  let cur = '';
  function setSrc(u) { cur = u; v.removeAttribute('crossorigin'); if (!q.has('nocors')) v.crossOrigin = 'anonymous'; v.src = u; msg('No movie'); } // crossorigin is needed for screenshots
  setSrc(q.get('video') || SRC);
  $('uf').addEventListener('submit', e => { e.preventDefault(); const u = $('u').value.trim(); if (u) setSrc(u); });
  let S = '', cam = { z: 1, x: 0, y: 0 }, z0 = 1, bi = 0, shots = [], drag = null, pan = null, wt;

  /* Shelf */
  MV.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sp mv'; b.dataset.i = i; b.style.setProperty('--c', m.c); b.setAttribute('aria-label', m.t); b.innerHTML = `<span>${m.t}</span>`; $('r0').append(b); });
  [1, 2].forEach(r => { for (let k = 0; k < 24; k++) { const f = document.createElement('i'); f.className = 'sp fl'; f.style.cssText = `width:${12 + (k * 7) % 10}px;--h:${52 + (k * 13 + r * 17) % 36}%;--c:hsl(${215 + (k * 9) % 40} 12% ${80 + (k * 5) % 10}%)`; $('r' + r).append(f); } });

  /* Camera */
  const VW = () => st.clientWidth, VH = () => st.clientHeight;
  const fit = (r, pad = 40, i = { r: 0, b: 0 }) => { const z = Math.min((VW() - i.r - pad * 2) / r[2], (VH() - i.b - pad * 2) / r[3]); return { z, x: (VW() - i.r) / 2 - (r[0] + r[2] / 2) * z, y: (VH() - i.b) / 2 - (r[1] + r[3] / 2) * z }; };
  const views = () => ({ all: [0, 0, 1500, 940], lib: [sh.offsetLeft, sh.offsetTop, sh.offsetWidth, sh.offsetHeight], booth: [bt.offsetLeft, bt.offsetTop, 640, 640], print: [bt.offsetLeft, bt.offsetTop, 640, 900], screen: [bt.offsetLeft + sr.offsetLeft, bt.offsetTop + sr.offsetTop, 480, 300] });
  function put() { wd.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`; st.classList.toggle('near', cam.z >= z0 * 1.3); }
  function view(n, pad) { const w = innerWidth > 720, i = S === 'border' ? (w ? { r: 230, b: 0 } : { r: 0, b: 200 }) : { r: 0, b: 0 }; cam = fit(views()[n], pad ?? (n === 'screen' ? 16 : 40), i); put(); }
  function zoom(k, mx = VW() / 2, my = VH() / 2) { const nz = Math.min(z0 * 5, Math.max(z0 * .6, cam.z * k)), r = nz / cam.z; cam = { z: nz, x: mx - (mx - cam.x) * r, y: my - (my - cam.y) * r }; put(); }
  function init() { wd.classList.add('free'); cam = fit(views().all, 20); z0 = cam.z; put(); requestAnimationFrame(() => wd.classList.remove('free')); }
  addEventListener('resize', init);
  st.addEventListener('wheel', e => { e.preventDefault(); wd.classList.add('free'); const b = st.getBoundingClientRect(); zoom(Math.exp(-e.deltaY * .0015), e.clientX - b.left, e.clientY - b.top); clearTimeout(wt); wt = setTimeout(() => wd.classList.remove('free'), 150); }, { passive: false });
  $('zi').onclick = () => zoom(1.35); $('zo').onclick = () => zoom(1 / 1.35); $('zf').onclick = () => view(S === 'play' ? 'booth' : S === 'print' ? 'print' : 'all');
  sh.addEventListener('click', () => { if (!st.classList.contains('near')) view('lib'); });

  /* Stages */
  function stage(s) { S = s; document.body.dataset.s = s; $('hint').textContent = H[s]; document.querySelectorAll('[data-on]').forEach(e => e.hidden = !e.dataset.on.split(' ').includes(s)); }
  function msg(t, p) { $('msg').hidden = !t; $('msg').innerHTML = t ? `<span>${t}</span>` + (p ? '<div class="pg"><i></i></div>' : '') : ''; }

  /* Pick a movie: drag into the slot, or click / Enter and it flies there */
  const ghost = (i, x, y) => { const g = document.createElement('div'); g.className = 'ghost'; g.style.background = MV[i].c; g.textContent = MV[i].t; g.style.transform = `translate(${x}px,${y}px)`; document.body.append(g); return g; };
  const slotOff = () => { const s = $('slot').getBoundingClientRect(); return s.right < 0 || s.left > innerWidth || s.bottom < 0 || s.top > innerHeight; };
  st.addEventListener('pointerdown', e => {
    const b = e.target.closest('.mv');
    if (b && S === 'browse' && st.classList.contains('near')) {
      const i = +b.dataset.i, r = b.getBoundingClientRect();
      drag = { g: ghost(i, e.clientX - 60, e.clientY - 75), i, x: e.clientX, y: e.clientY, m: false, r };
      if (slotOff()) view('all'); st.setPointerCapture(e.pointerId); return;
    }
    if (e.target.closest('button,input,.bar')) return;
    pan = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; st.setPointerCapture(e.pointerId); wd.classList.add('free');
  });
  st.addEventListener('pointermove', e => {
    if (drag) { drag.g.style.transform = `translate(${e.clientX - 60}px,${e.clientY - 75}px)`; if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.m = true; }
    else if (pan) { cam.x = pan.cx + e.clientX - pan.x; cam.y = pan.cy + e.clientY - pan.y; put(); }
  });
  st.addEventListener('pointerup', e => {

    if (!drag) return; const d = drag; drag = null, s = $('slot').getBoundingClientRect();
    const over = e.clientX > s.left - 70 && e.clientX < s.right + 70 && e.clientY > s.top - 90 && e.clientY < s.bottom + 70;
    if (d.m && !over) { d.g.remove(); return; }

  });
  st.addEventListener('pointercancel', () => { if (drag) { drag.g.remove(); drag = null; } });
  $('r0').addEventListener('click', e => {
    const b = e.target.closest('.mv'); if (!b || e.detail || S !== 'browse') return; // keyboard activation
    const i = +b.dataset.i, r = b.getBoundingClientRect(), d = { g: ghost(i, r.left, r.top), i }; if (slotOff()) view('all'); setTimeout(() => fly(d), 720);
  });
  function fly(d) {
    const s = $('slot').getBoundingClientRect();
    d.g.style.transition = 'transform .55s cubic-bezier(.5,0,.3,1),opacity .2s .4s';
    requestAnimationFrame(() => { d.g.style.transform = `translate(${s.left + s.width / 2 - 60}px,${s.top + s.height / 2 - 75}px) scale(.4)`; d.g.style.opacity = 0; });
    setTimeout(() => d.g.remove(), 750); read(d.i);
  }
  function read(i) {
    stage('reading'); bt.classList.add('reading'); msg('Reading…', 1);
    setTimeout(() => {
      const seek = () => { v.currentTime = MV[i].p * (v.duration || 0); };
      v.readyState >= 1 ? seek() : v.addEventListener('loadedmetadata', seek, { once: true });
      bt.classList.remove('reading'); msg(''); stage('border'); view('booth');

  }
  v.addEventListener('error', () => {
    if (v.crossOrigin) { v.removeAttribute('crossorigin'); v.src = cur; msg('No movie'); } // host has no CORS: still plays, screenshots will be blocked
    else msg('This movie could not load. Check that the URL is a direct, public video file.');
  });

  /* Borders: the only decoration. One paint function serves preview, picker and screenshots. */
  const star = (c, x, y, col) => { c.fillStyle = col; c.fillText('★', x, y); };
  const B = [
    { n: 'Plain', win: (w, h) => [w * .05, h * .05, w * .9, h * .8], paint(c, w, h) { c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.strokeStyle = '#c9cdd6'; c.lineWidth = 2; c.strokeRect(1, 1, w - 2, h - 2); } },
    { n: 'Film', win: (w, h) => [w * .1, h * .12, w * .8, h * .76], paint(c, w, h) { c.fillStyle = '#17181c'; c.fillRect(0, 0, w, h); c.fillStyle = '#e9e6df'; for (let x = 14; x < w - 10; x += 34) { c.fillRect(x, h * .035, 18, h * .05); c.fillRect(x, h * .915, 18, h * .05); } } },
    { n: 'Dots', win: (w, h) => [w * .06, h * .06, w * .88, h * .82], paint(c, w, h) { c.fillStyle = '#c8b9f0'; c.fillRect(0, 0, w, h); c.fillStyle = '#fff'; for (let y = 12; y < h; y += 24) for (let x = 12; x < w; x += 24) { c.beginPath(); c.arc(x, y, 4, 0, 7); c.fill(); } } },
    { n: 'Stars', win: (w, h) => [w * .07, h * .07, w * .86, h * .76], paint(c, w, h) { c.fillStyle = '#d8d2d5'; c.fillRect(0, 0, w, h); const k = ['#e9578a', '#4d9be6', '#f2b632', '#5bbf8a']; c.font = `${h * .06}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; let i = 0; for (let x = 24; x < w; x += 46) { star(c, x, h * .035, k[i++ % 4]); star(c, x, h * .93, k[i++ % 4]); } for (let y = h * .15; y < h * .86; y += 46) { star(c, w * .035, y, k[i++ % 4]); star(c, w * .965, y, k[i++ % 4]); } } },
    { n: 'Checker', win: (w, h) => [w * .07, h * .07, w * .86, h * .8], paint(c, w, h) { for (let y = 0; y < h; y += 20) for (let x = 0; x < w; x += 20) { c.fillStyle = ((x + y) / 20) % 2 ? '#7a5c52' : '#f1e4d3'; c.fillRect(x, y, 20, 20); } } }
  ];
  function applyBorder(i) {
    bi = i; const c = $('fr').getContext('2d'), [x, y, w, h] = B[i].win(640, 400);
    c.clearRect(0, 0, 640, 400); B[i].paint(c, 640, 400); c.clearRect(x, y, w, h);
    Object.assign(v.style, { position: 'absolute', left: x / 6.4 + '%', top: y / 4 + '%', width: w / 6.4 + '%', height: h / 4 + '%', objectFit: 'cover' });
    document.querySelectorAll('.bo').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  }
  B.forEach((b, i) => {
    const el = document.createElement('button'), c = document.createElement('canvas'); el.type = 'button'; el.className = 'bo'; c.width = 128; c.height = 80;
    const x = c.getContext('2d'); b.paint(x, 128, 80); const [a, y, w, h] = b.win(128, 80); x.fillStyle = '#bcd6f7'; x.fillRect(a, y, w, h);
    el.append(c, Object.assign(document.createElement('span'), { textContent: b.n })); el.onclick = () => applyBorder(i); $('bos').append(el);
  });
  $('ok').onclick = () => { stage('play'); view('booth'); const b = $('bar'); b.style.left = (480 - b.offsetWidth) / 2 + 'px'; b.style.top = 300 - b.offsetHeight - 10 + 'px'; v.play().catch(() => {}); };

  /* Controls: movable bar, seek buttons, volume, screenshot */
  $('rw').onclick = () => { v.currentTime = Math.max(0, v.currentTime - 10); };
  $('ff').onclick = () => { v.currentTime = Math.min(v.duration || 0, v.currentTime + 10); };
  $('vol').oninput = e => { v.volume = +e.target.value; v.muted = false; };
  $('grip').addEventListener('pointerdown', e => {
    e.preventDefault(); const b = $('bar'), g = e.target.closest('.grip'), o = { x: e.clientX, y: e.clientY, l: b.offsetLeft, t: b.offsetTop }; g.setPointerCapture(e.pointerId);
    const m = ev => { b.style.left = Math.min(480 - b.offsetWidth, Math.max(0, o.l + (ev.clientX - o.x) / cam.z)) + 'px'; b.style.top = Math.min(300 - b.offsetHeight, Math.max(0, o.t + (ev.clientY - o.y) / cam.z)) + 'px'; };
    const u = () => { g.removeEventListener('pointermove', m); g.removeEventListener('pointerup', u); }; g.addEventListener('pointermove', m); g.addEventListener('pointerup', u);
  });
  $('snap').onclick = () => {
    try {
      const c = document.createElement('canvas'); c.width = 640; c.height = 400; const x = c.getContext('2d'), [wx, wy, ww, wh] = B[bi].win(640, 400);
      B[bi].paint(x, 640, 400); const s = Math.max(ww / v.videoWidth, wh / v.videoHeight), sw = ww / s, sh2 = wh / s;
      x.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh2) / 2, sw, sh2, wx, wy, ww, wh);

      const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    } catch (e) { msg('This video host blocks screenshots (CORS).'); setTimeout(() => msg(''), 2500); }
  };
  const gal = () => { $('gal').innerHTML = shots.map(s => `<img src="${s}" alt="Screenshot">`).join(''); };
  $('sh').onclick = () => { $('gal').hidden = !$('gal').hidden; };
  $('fc').onclick = () => { const f = document.body.classList.toggle('focus'); $('fc').textContent = f ? 'Show booth' : 'Focus movie'; view(f ? 'screen' : (S === 'border' ? 'booth' : 'booth')); };

  /* Printing: strips of up to four framed screenshots slide out of the booth */
  async function printShots() {
    if (S === 'print') return; v.pause(); document.body.classList.remove('focus'); $('fc').textContent = 'Focus movie'; stage('print'); view('print', 30);
    if (!shots.length) { $('hint').textContent = 'No screenshots were taken, so nothing was printed.'; return; }

      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); g.forEach((im, j) => x.drawImage(im, 20, 20 + j * 214, 320, 200));

  $('lc').onclick = () => { $('lb').hidden = true; }; addEventListener('keydown', e => { if (e.key === 'Escape') $('lb').hidden = true; });

})();
